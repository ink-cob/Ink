<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat Ink</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Окно авторизации -->
    <div id="auth-container" class="auth-box">
        <h2>Chat Ink</h2>
        <div id="auth-forms">
            <div id="login-form">
                <h3>Вход</h3>
                <input type="text" id="login-id" placeholder="Уникальный ID (5 знаков)">
                <input type="password" id="login-pass" placeholder="Пароль">
                <button class="tg-btn" onclick="login()">Войти</button>
                <p>Нет аккаунта? <span class="link" onclick="toggleAuth(false)">Зарегистрироваться</span></p>
            </div>
            <div id="register-form" class="hidden">
                <h3>Регистрация</h3>
                <input type="text" id="reg-name" placeholder="Имя">
                <input type="password" id="reg-pass" placeholder="Пароль">
                <button class="tg-btn" onclick="register()">Создать аккаунт</button>
                <p>Уже есть аккаунт? <span class="link" onclick="toggleAuth(true)">Войти</span></p>
            </div>
        </div>
    </div>

    <!-- Основной интерфейс мессенджера -->
    <div id="app-container" class="hidden">
        <!-- Левая панель (Контакты) -->
        <div class="sidebar" id="app-sidebar">
            <div class="sidebar-header">
                <h3>Chat Ink</h3>
                <div class="header-actions">
                    <button id="theme-btn" class="icon-btn" onclick="toggleTheme()">🌓</button>
                    <button class="tg-btn small-btn" onclick="openProfile()">Профиль</button>
                </div>
            </div>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Поиск по ID...">
                <button class="tg-btn square-btn" onclick="searchContact()">+</button>
            </div>
            <div class="contacts-list" id="contacts-list">
                <!-- Контакты загружаются динамически -->
            </div>
        </div>

        <!-- Правая панель (Чат) -->
        <div class="chat-area" id="app-chat-area">
            <div id="chat-blank" class="chat-blank">Выберите чат для начала общения</div>
            
            <div id="chat-active" class="hidden">
                <div class="chat-header">
                    <div class="chat-header-left">
                        <button id="back-btn" class="back-button tg-btn" onclick="closeChat()">⬅ Назад</button>
                        <div>
                            <span id="active-chat-name">Имя контакта</span>
                            <span id="active-chat-status" class="status-dot"></span>
                        </div>
                    </div>
                    <button id="delete-friend-btn" class="danger-link-btn" onclick="deleteCurrentFriend()">Удалить из друзей</button>
                </div>
                <div class="messages-container" id="messages-container"></div>
                <div class="input-area">
                    <input type="text" id="message-input" placeholder="Напишите сообщение...">
                    <button class="tg-btn send-btn" onclick="sendMessage()">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно профиля -->
    <div id="profile-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Ваш профиль</h3>
            <div class="profile-info-block">
                <p><strong>Ваш ID:</strong> <span id="prof-id"></span></p>
                <p><strong>Создан:</strong> <span id="prof-date"></span></p>
            </div>
            <label>Имя пользователя: <input type="text" id="prof-name"></label>
            <label>Пароль аккаунта: <input type="password" id="prof-pass"></label>
            <div class="modal-buttons">
                <button class="tg-btn" onclick="saveProfile()">Сохранить изменения</button>
                <button class="tg-btn danger-btn" onclick="deleteAccount()">Удалить аккаунт</button>
                <button class="tg-btn cancel-btn" onclick="closeProfile()">Закрыть</button>
            </div>
        </div>
    </div>
</body>
</html>
