<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat Ink</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Окно авторизации -->
    <div id="auth-container" class="auth-box">
        <h2>Chat Ink</h2>
        <div id="auth-forms">
            <div id="login-form">
                <h3>Вход</h3>
                <input type="text" id="login-id" placeholder="Уникальный ID (5 знаков)">
                <input type="password" id="login-pass" placeholder="Пароль">
                <button onclick="login()">Войти</button>
                <p>Нет аккаунта? <span class="link" onclick="toggleAuth(false)">Зарегистрироваться</span></p>
            </div>
            <div id="register-form" class="hidden">
                <h3>Регистрация</h3>
                <input type="text" id="reg-name" placeholder="Имя">
                <input type="password" id="reg-pass" placeholder="Пароль">
                <button onclick="register()">Создать аккаунт</button>
                <p>Уже есть аккаунт? <span class="link" onclick="toggleAuth(true)">Войти</span></p>
            </div>
        </div>
    </div>

    <!-- Основной интерфейс мессенджера -->
    <div id="app-container" class="hidden">
        <!-- Левая панель (Контакты) -->
        <div class="sidebar" id="app-sidebar">
            <div class="sidebar-header">
                <h3>Chat Ink</h3>
                <button id="theme-btn" onclick="toggleTheme()">🌓</button>
                <button onclick="openProfile()">Профиль</button>
            </div>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Поиск по ID...">
                <button onclick="searchContact()">+</button>
            </div>
            <div class="contacts-list" id="contacts-list">
                <div class="contact-item" id="chat-global" onclick="selectChat('global')">
                    <div class="contact-info">
                        <div class="contact-name">📢 Общий канал</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Правая панель (Чат) -->
        <div class="chat-area" id="app-chat-area">
            <div id="chat-blank" class="chat-blank">Выберите чат для начала общения</div>
            
            <div id="chat-active" class="hidden">
                <div class="chat-header">
                    <div class="chat-header-left">
                        <!-- Кнопка Назад для телефонов -->
                        <button id="back-btn" class="back-button" onclick="closeChat()">⬅ Назад</button>
                        <div>
                            <span id="active-chat-name">Имя контакта</span>
                            <span id="active-chat-status" class="status-dot"></span>
                        </div>
                    </div>
                    <button id="delete-friend-btn" onclick="deleteCurrentFriend()">Удалить из друзей</button>
                </div>
                <div class="messages-container" id="messages-container"></div>
                <div class="input-area">
                    <input type="text" id="message-input" placeholder="Напишите сообщение...">
                    <input type="password" id="admin-pass-input" placeholder="Пароль админа" class="hidden">
                    <button onclick="sendMessage()">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно профиля -->
    <div id="profile-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Ваш профиль</h3>
            <p>ID: <span id="prof-id"></span></p>
            <p>Дата создания: <span id="prof-date"></span></p>
            <label>Имя: <input type="text" id="prof-name"></label>
            <label>Пароль: <input type="password" id="prof-pass"></label>
            <div class="modal-buttons">
                <button onclick="saveProfile()">Сохранить</button>
                <button class="danger" onclick="deleteAccount()">Удалить аккаунт</button>
                <button onclick="closeProfile()">Закрыть</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
